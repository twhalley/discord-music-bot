version: 2
updates:
  # Python dependencies pinned in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dev:
        dependency-type: development
    open-pull-requests-limit: 5

  # GitHub Actions — keeps the pinned SHAs current (Dependabot updates the
  # comment tag AND the SHA together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base image digest in the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
