name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# GHCR publish needs package write; contents read for checkout;
# security-events write lets Trivy upload SARIF to the Security tab.
permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build, scan & push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Don't leave the job token in .git/config for later steps.
          persist-credentials: false

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long

      # Scan every architecture we publish. `load: true` can only materialise
      # one platform at a time, so each is built and scanned in turn. Skipping
      # arm64 here would leave the image the Oracle VM actually runs unscanned.
      - name: Build amd64 image for scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:scan-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan amd64 (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: ${{ env.IMAGE }}:scan-amd64
          format: sarif
          output: trivy-amd64.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # Without this, `severity` filters only the console report: the SARIF
          # still receives every severity, and `exit-code` keys off that. The
          # job then fails on MEDIUMs despite claiming a HIGH/CRITICAL gate.
          limit-severities-for-sarif: true
          # Scan for CVEs only. The secret scanner otherwise flags constants
          # bundled inside third-party libraries (e.g. yt-dlp's extractors) as
          # fake "secrets"; our real secrets are injected from the env at runtime.
          scanners: vuln

      - name: Upload amd64 Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-amd64.sarif
          # Distinct categories keep the two architectures' findings from
          # overwriting each other in the Security tab.
          category: trivy-amd64

      # arm64 is what the Oracle Ampere VM runs, so it gets the same gate.
      # Built under QEMU emulation, hence slower than the amd64 pass.
      - name: Build arm64 image for scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:scan-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan arm64 (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: ${{ env.IMAGE }}:scan-arm64
          format: sarif
          output: trivy-arm64.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          scanners: vuln

      - name: Upload arm64 Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-arm64

      # Only publish the multi-arch image after the scan passes.
      - name: Build & push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
