name: Deploy

# Manual trigger keeps deploys deliberate. The `production` environment gates
# access to secrets and can require a reviewer's approval (repo Settings ->
# Environments -> production -> Required reviewers).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. latest or a git sha)"
        required: false
        default: latest

# packages:read lets GITHUB_TOKEN pull the image from GHCR, which is private by
# default; without it the pull fails with a 403.
permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Pin the host key. Without `fingerprint` this action accepts ANY host
          # key, so anything answering on SSH_HOST -- a recycled ephemeral IP, a
          # hijacked route -- would be handed the bot token below.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # Fail the deploy if any step errors.
          script_stop: true
          # Secrets travel as env vars rather than being interpolated into the
          # script text that is sent to the remote shell.
          envs: IMAGE_REPO,IMAGE_TAG,BOT_TOKEN,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            # A non-interactive SSH session doesn't set this, and
            # `systemctl --user` fails without it.
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"

            IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"

            # Written 0600 by umask and owned by the deploy user, so the token
            # never needs root and never lands in the image or in logs.
            umask 077
            mkdir -p "${HOME}/.config/musicbot"
            printf 'DISCORD_BOT_TOKEN=%s\n' "${BOT_TOKEN}" \
              > "${HOME}/.config/musicbot/env"

            # Login and pull are both rootless, as the same user, so they share
            # one auth.json. (Mixing `podman login` with `sudo podman pull` does
            # not work -- root reads a different credential store.)
            printf '%s' "${GHCR_TOKEN}" \
              | podman login ghcr.io -u "${GHCR_USER}" --password-stdin
            podman pull "${IMAGE}"

            # Point the user unit at the freshly pulled tag and restart it.
            printf 'MUSICBOT_IMAGE=%s\n' "${IMAGE}" \
              > "${HOME}/.config/musicbot/image"
            systemctl --user restart musicbot.service
            systemctl --user --no-pager status musicbot.service | head -n 10
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.event.inputs.tag }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
