[project]
name = "musicbot"
version = "0.1.0"
description = "A hardened Discord bot that streams YouTube and SoundCloud audio into voice channels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "twhalley" }]
dependencies = [
    # The [voice] extra is load-bearing. discord.py 2.7 moved voice onto
    # Discord's DAVE protocol, so connecting to a channel now needs `davey` in
    # addition to PyNaCl. Without it the bot starts, logs in and syncs commands
    # perfectly well, then every /play dies inside channel.connect() with
    # "RuntimeError: davey library needed in order to use voice" -- the only
    # hint at startup is a WARNING that is easy to read as advisory.
    "discord.py[voice]==2.7.1",
    # discord.py's voice extra requires PyNaCl<1.6. 1.6.2 was pinned here,
    # outside that range: pip did not object because PyNaCl was named directly
    # rather than resolved through the extra. Check that bound before bumping.
    "PyNaCl==1.5.0",
    "davey==0.1.6",
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
]

[project.scripts]
musicbot = "musicbot.__main__:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
# S101: asserts are fine in tests (handled per-file below)
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests may assert and use dummy "tokens"/secrets as fixtures.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["musicbot"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# discord.py / yt-dlp ship partial stubs; don't fail the build on their internals.
[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=musicbot --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["musicbot"]
branch = true
# Only the cog is excluded: driving it needs a live gateway and voice client.
# Everything it delegates to — queue, source, config, urls — is covered, as are
# intent selection and the entrypoint wiring in bot.py/__main__.py.
#
# Note this means the command handlers themselves are unmeasured, so the figure
# below describes the logic behind the commands, not the Discord surface.
omit = [
    "src/musicbot/cogs/*",
]
